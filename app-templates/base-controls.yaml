# metadata
_schemaVersion: '2.0'
_key: LayoutDefs

# these correspond to webcomponent custom tags

UI_Declarations:
  - ui-form
  - ui-metadata
  - ui-group

UI_Inputs:
  # html built-in
  - in-text
  - in-checkbox
  - in-number
  - in-integer
  - in-select
  - in-range
  - in-slider
  # extended controls
  - in-range
  - in-color
  - in-token
  - in-date
  - in-time
  - in-datetime

UI_Outputs:
  # html built-in
  - out-text
  - out-number
  - out-integer
  - out-checkbox
  - out-ol
  - out-ul
  # extended controls
  - out-date
  - out-time
  - out-datetime

UI_Widgets:
  - out-table
