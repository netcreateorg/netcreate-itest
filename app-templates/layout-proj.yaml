# metadata
_schemaVersion: '2.0'
_key: LayoutDefs

# this file declares the default metadata for rendering a project
# user interface. it does not store values! it defines the text that
# shows in user interface elements!

# Defaults for project metadata
projectMeta:
  description:
    label: 'description'
    tooltip: 'Enter a description for the project'
    help: 'Enter a description for the project'

# Default citation settings for the project (?)
citationPrompts:
  citation:
    label: 'Citation'
    tooltip: 'Enter the citation for the project'
    help: 'Enter the citation for the project'

# Global default permissions for the running application
permissions:
  requireLogin:
    label: 'Login'
  hideDeleteNodeButton:
    label: 'Hide Delete Node'
  allowLoggedInUserToImport:
    label: 'Allow Import'

# Strings related to access control
accessControls:
  duplicateWarning:
    label: 'duplicateWarning'
  nodeIsLockedMessage:
    label: 'nodeIsLockedMessage'
  edgeIsLockedMessage:
    label: 'edgeIsLockedMessage'
  templateIsLockedMessage:
    label: 'templateIsLockedMessage'
  importIsLockedMessage:
    label: 'importIsLockedMessage'

prompts:
  # filter tab panels
  filterFade:
    label: 'Fade'
  filterFadeHelp:
    label: 'Fade Help'
  filterReduce:
    label: 'Reduce'
  filterReduceHelp:
    label: 'Reduce Help'
  filterFocus:
    label: 'Focus'
  filterFocusHelp:
    label: 'Focus Help'

# Defaults for the D3-based GraphView renderer
graphView:
  nodeSizeDefault:
    label: 'nodeSizeDefault'
  nodeSizeMax:
    label: 'nodeSizeMax'
  edgeSizeDefault:
    label: 'edgeSizeDefault'
  edgeSizeMax:
    label: 'edgeSizeMax'
  nodeDefaultTransparency:
    label: 'nodeDefaultTransparency'
  edgeDefaultTransparency:
    label: 'edgeDefaultTransparency'
  searchColor:
    label: 'searchColor'
  sourceColor:
    label: 'sourceColor'
