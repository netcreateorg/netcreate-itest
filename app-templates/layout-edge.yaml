# metadata
_schemaVersion: '2.0'

# shared elements type setting

UI_EdgeCommonControls: &SharedControls
  isProvenance:
    control: 'in-checkbox'
    default: false
  hidden:
    control: 'in-checkbox'
    default: false
  includeInGraphTooltip:
    control: 'in-checkbox'
    default: false

# ui metadata definition for edges
# note that this definition comingles visual properties with
# metadata which might need detangling

UI_EdgeDef:
  control: 'ui-form'

  id: # id ui field
    control: 'out-text'
    <<: *SharedControls
    displayLabel: 'Id'
    help: 'System-generated unique id'

  source:
    control: 'out-text'
    <<: *SharedControls
    displayLabel: 'Source'
    help: 'Edge source node'

  target:
    control: 'out-text'
    <<: *SharedControls
    displayLabel: 'Target'
    help: 'Edge target node'

  type: # edge types
    control: 'in-select'
    options:
      - color: '#eeeeee'
        label: ''
    <<: *SharedControls
    displayLabel: 'Type'
    help: 'Type of edge connection'

  notes:
    <<: *SharedControls
    control: 'in-text'
    displayLabel: 'Notes'
    help: 'Significance of the connection'

  weight:
    control: 'in-number'
    <<: *SharedControls
    displayLabel: 'Weight'
    help: 'Weight of edge'
    conditions: [isGraphTooltip]

  infoOrigin:
    control: 'in-text'
    <<: *SharedControls
    displayLabel: 'Info Origin'
    help: 'Who created this? (aka Source)'
    conditions: [isGraphTooltip, isProvenance]

  citation:
    control: 'in-text'
    <<: *SharedControls
    displayLabel: 'Citation'
    help: 'Source Book.Chapter (e.g. "Part 2 06.03")'

  category:
    control: 'in-text'
    <<: *SharedControls
    displayLabel: 'Category'
    help: 'Category (deprecated)'
    conditions: [isHidden]

  created:
    control: 'out-datetime'
    <<: *SharedControls
    displayLabel: 'Created'
    help: 'Date and time edge was created'
    conditions: [isGraphTooltip]

  createdBy:
    control: 'out-text'
    <<: *SharedControls
    displayLabel: 'Created By'
    help: 'Author who created the edge'
    conditions: [isGraphTooltip]

  updated:
    control: 'out-datetime'
    <<: *SharedControls
    displayLabel: 'Updated'
    help: 'Date and time edge was last modified'
    conditions: [isGraphTooltip]

  updatedBy:
    control: 'out-text'
    <<: *SharedControls
    displayLabel: 'Updated By'
    help: 'Author who updated the edge'
    conditions: [isGraphTooltip]

  revision:
    <<: *SharedControls
    control: 'out-integer'
    displayLabel: 'Revision'
    help: 'Number of times this edge has been revised'
    conditions: [isGraphTooltip]
