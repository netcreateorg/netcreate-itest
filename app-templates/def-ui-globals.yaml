# metadata
_schemaVersion: '2.0'

UI_Strings:
  # filter tab panels
  filterFade: 'Fade'
  filterFadeHelp: 'Show matches, Fade others'
  filterReduce: 'Reduce'
  filterReduceHelp: 'Show matches, Reduce (remove) others & recalculate sizes'
  filterFocus: 'Focus'
